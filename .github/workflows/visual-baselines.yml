name: Visual baselines

# Creates (or recreates) the Playwright screenshot baselines of apps/e2e/tests/visual.spec.ts in
# CI's Linux environment, where the visual checks run, and uploads them as an artifact to commit
# under apps/e2e/tests/visual.spec.ts-snapshots/. Run by hand after an intended visual change.
on:
  workflow_dispatch:

# Read-only token (code audit 2, decision 651).
permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ps/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e --project=chromium tests/visual.spec.ts --update-snapshots
        env:
          CI: 'true'
          VISUAL_BASELINES: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: apps/e2e/tests/visual.spec.ts-snapshots
          retention-days: 14
