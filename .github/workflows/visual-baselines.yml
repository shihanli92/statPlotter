name: Visual baselines

# Creates (or recreates) the Playwright screenshot baselines of apps/e2e/tests/visual.spec.ts in
# CI's Linux environment, where the visual checks run, and uploads them as an artifact to commit
# under apps/e2e/tests/visual.spec.ts-snapshots/. Run by hand after an intended visual change.
on:
  workflow_dispatch:

# Read-only token (code audit 2, decision 651).
permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ps/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e --project=chromium tests/visual.spec.ts --update-snapshots
        env:
          CI: 'true'
          VISUAL_BASELINES: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: apps/e2e/tests/visual.spec.ts-snapshots
          retention-days: 14
