name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job (code audit 2, decision 651): none writes to the repository;
# the (private) deploy job uses Cloudflare's token, and artifacts go through the run's own token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm lint
      - run: pnpm typecheck
      # Oracle and NIST fixtures are committed, so tests need neither R nor network access.
      - run: pnpm test
      - run: pnpm --filter @ps/web build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # End-to-end tests of the production build (roadmap 24) before every deploy: Chromium, split
  # across two machines. WebKit and Firefox run every night (e2e-nightly.yml).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @ps/e2e exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ps/e2e exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ps/e2e exec playwright install-deps chromium
      - run: pnpm e2e --project=chromium --shard=${{ matrix.shard }}/2
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14

  # The private deployment: in the private repository, pushes to main that pass the checks and the
  # Chromium end-to-end tests would go live on Cloudflare Pages (project "plotter", behind
  # Cloudflare Access), with the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. Actions are
  # turned off there (audit 4, T6), so nothing deploys from here: the public demo is built by
  # Netlify from the public repository (docs/PUBLISHING.md), where this job is skipped.
  deploy:
    needs: [check, e2e]
    # Only in the project's own repository (audit 3, T11): a copy elsewhere has no secrets.
    if: github.repository == 'shihanli92/plottingTool' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=plotter --branch=main --commit-dirty=true
