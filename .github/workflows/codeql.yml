name: CodeQL

# Code scanning of the JavaScript and TypeScript (roadmap 48): in the public repository only,
# where GitHub runs it for free (a private repository needs GitHub Advanced Security). Pushes to
# main, pull requests to it, and every week (new queries find old code).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 2'

# Read-only token (code audit 2, decision 651); the job adds only what uploading results needs.
permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'shihanli92/statPlotter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
