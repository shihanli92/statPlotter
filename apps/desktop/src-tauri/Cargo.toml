[package]
name = "ps-desktop"
version = "0.3.8"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "ps_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Roadmap 41: updates from GitHub Releases (started only in builds with an update key) and the
# relaunch after one is installed.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Roadmap 41: a file opened while the app runs (Windows, Linux) goes to the running app.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Copy as vector (roadmap 23): PDF / PNG / SVG on the pasteboard. Already in the lockfile through
# tao and wry; only the pasteboard classes are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
